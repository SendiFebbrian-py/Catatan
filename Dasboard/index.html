<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Keuangan kandang</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dasbostell.css" />
  </head>

  <body>
    <div class="container">
      <h1>📊 DASHBOARD KEUANGAN KANDANG</h1>

      <!-- MENU -->
      <div class="menu">
        <button onclick="show('penjualan')">Penjualan</button>
        <button onclick="show('pembelian')">Pembelian</button>
        <button onclick="show('variabel')">Biaya Variabel</button>
        <button onclick="show('tetap')">Gaji</button>
        <button onclick="show('peroleh')">Acuan</button>
        <button onclick="show('statistik')">Statistik</button>

        <a href="../index.html">
          <button>Kembali</button>
        </a>
      </div>

      <!-- ================= PENJUALAN ================= -->
      <section id="penjualan" class="card active">
        <div class="card-header">
          <h2>Data Penjualan</h2>
          <input class="search" placeholder="Cari..." onkeyup="cari(this)" />
        </div>

        <button
          id="hapusPenjualan"
          class="btn-danger hidden"
          onclick="hapusTerpilih('penjualan')"
        >
          Hapus Terpilih
        </button>

        <div class="table-wrap">
          <table></table>
        </div>
      </section>

      <!-- ================= PEMBELIAN ================= -->
      <section id="pembelian" class="card">
        <div class="card-header">
          <h2>Data Pembelian</h2>
          <input class="search" placeholder="Cari..." onkeyup="cari(this)" />
        </div>

        <button
          id="hapusPembelian"
          class="btn-danger hidden"
          onclick="hapusTerpilih('pembelian')"
        >
          Hapus Terpilih
        </button>

        <div class="table-wrap">
          <table></table>
        </div>
      </section>

      <!-- ================= VARIABEL ================= -->
      <section id="variabel" class="card">
        <div class="card-header">
          <h2>Biaya Variabel</h2>
          <input class="search" placeholder="Cari..." onkeyup="cari(this)" />
        </div>

        <button
          id="hapusVariabel"
          class="btn-danger hidden"
          onclick="hapusTerpilih('variabel')"
        >
          Hapus Terpilih
        </button>

        <div class="table-wrap">
          <table></table>
        </div>
      </section>

      <!-- ================= TETAP ================= -->
      <section id="tetap" class="card">
        <div class="card-header">
          <h2>Data Gaji Anggota</h2>
          <input class="search" placeholder="Cari..." onkeyup="cari(this)" />
        </div>

        <button
          id="hapusTetap"
          class="btn-danger hidden"
          onclick="hapusTerpilih('tetap')"
        >
          Hapus Terpilih
        </button>

        <div class="table-wrap">
          <table></table>
        </div>
      </section>

      <!-- ================= DATA TERKUNCI ================= -->
      <section id="peroleh" class="card locked">
        <div class="card-header">
          <h2>Data Acuan Penjualan</h2>
          <input class="search" placeholder="Cari..." onkeyup="cari(this)" />
        </div>

        <div class="table-wrap">
          <table></table>
        </div>
      </section>

      <!-- ================= STATISTIK ================= -->
      <section id="statistik" class="card">
        <h2>Statistik</h2>

        <!-- 🔥 GRID STAT -->
        <div class="stat-grid">
          <div class="stat-box">
            <p>Total Pembelian sapi</p>
            <h3 id="totalBeli">Rp 0</h3>
          </div>

          <div class="stat-box">
            <p>Total Keuntungan jual sapi</p>
            <h3 id="totalUntung">Rp 0</h3>
          </div>
        </div>

        <!-- 🔵 CHART -->
        <div class="chart-wrapper">
          <div class="circle-wrap">
            <canvas id="chartBreakdown" width="220" height="220"></canvas>

            <div id="legendBreakdown" class="legend"></div>
          </div>

          <div class="circle-wrap">
            <canvas id="chartTotal" width="220" height="220"></canvas>

            <div class="circle-center">
              <div class="total-label">TOTAL</div>
              <div class="total-value" id="totalText"></div>
              <div class="legend dummy"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="dasbrain.js"></script>
  </body>
</html>
