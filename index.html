<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Catatan Kandang</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ICON -->
    <link rel="icon" href="icons/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="icons/icon-512.png"
    />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1e3c72" />

    <!-- STYLE -->
    <link rel="stylesheet" href="stayleee.css" />
  </head>

  <body>
    <!-- ================= LOADING ================= -->
    <div id="loading-screen">
      <div class="loading-box">
        <div class="loading-text">Sabar ya...</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>

    <!-- ================= LOGIN ================= -->
    <div id="login-screen" class="card hidden">
      <h2>Login</h2>

      <input id="username" placeholder="Username" />
      <input id="password" type="password" placeholder="Password" />

      <!-- ERROR -->
      <p id="login-error" class="hidden error-text">
        Username atau password salah
      </p>

      <button onclick="login()">Masuk</button>
    </div>

    <!-- ================= APP ================= -->
    <div class="card app-hidden" id="app">
      <h2>Catatan Peternakan</h2>

      <!-- PILIH JENIS -->
      <label for="sheet">Pilih Jenis Data</label>
      <select id="sheet" onchange="ubahForm()">
        <option value="">-- Pilih --</option>
        <option value="Beli sapi">Catat Pembelian Sapi</option>
        <option value="Jual sapi">Catat Penjualan Sapi</option>
        <option value="Biaya Tetap">Catat Gaji Orang Kandang</option>
        <option value="Biaya variabel">Catat Biaya Pakan & dsb</option>
        <option value="Swap">Swap Blok</option>
        <option value="Pindah">Pindah Blok</option>
      </select>

      <!-- ===== BELI ===== -->
      <div id="formBeli" class="hidden">
        <label>Blok</label>
        <select id="posisi"></select>

        <label>Harga Beli</label>
        <input id="hargaBeli" type="text" class="uang" />

        <label>Tanggal</label>
        <input id="tanggalbeli" type="date" class="auto-tanggal" />

        <button onclick="kirim()">Simpan Data</button>
      </div>

      <!-- ===== TETAP ===== -->
      <div id="formTetap" class="hidden">
        <label>Nama</label>
        <select id="namaTetap">
          <option value="">-- Pilih --</option>
          <option value="Angga">Angga</option>
          <option value="Dedi">Dedi</option>
        </select>

        <label>Gaji</label>
        <select id="JumlahTetap">
          <option value="2000000">2.000.000</option>
        </select>

        <label>Beras</label>
        <input id="Beras" class="uang" />

        <label>Tanggal</label>
        <input id="tanggaltetap" type="date" class="auto-tanggal" />

        <button onclick="kirim()">Simpan Data</button>
      </div>

      <!-- ===== VARIABEL ===== -->
      <div id="formVariabel" class="hidden">
        <label>Barang</label>
        <input id="barang" />

        <label>Jumlah</label>
        <input id="jumlahVar" class="uang" />

        <label>Harga</label>
        <input id="hargaVar" class="uang" />

        <label>Tanggal</label>
        <input id="tanggalvar" type="date" class="auto-tanggal" />

        <button onclick="kirim()">Simpan Data</button>
      </div>

      <!-- ===== JUAL ===== -->
      <div id="formJual" class="hidden">
        <label>Blok</label>
        <select id="posisiJual"></select>

        <label>Harga Jual</label>
        <input id="hargaJual" class="uang" />

        <label>Tanggal</label>
        <input id="tanggaljual" type="date" class="auto-tanggal" />

        <button onclick="kirim()">Simpan Data</button>
      </div>

      <!-- ===== SWAP ===== -->
      <div id="formSwap" class="hidden">
        <label>Blok 1</label>
        <select id="swap1"></select>

        <label>Blok 2</label>
        <select id="swap2"></select>

        <button onclick="prosesSwap()">Tukar Posisi</button>
      </div>

      <!-- ===== PINDAH ===== -->
      <div id="formPindah" class="hidden">
        <label>Blok Asal</label>
        <select id="pindah1"></select>

        <label>Blok Tujuan (kosong)</label>
        <select id="pindah2"></select>

        <button onclick="prosesPindah()">Pindah Posisi</button>
      </div>

      <!-- DASHBOARD -->
      <a href="Dasboard/index.html">
        <button>Dashboard</button>
      </a>

      <!-- LOGOUT -->
      <button onclick="logout()">Logout</button>

      <div class="footer">Versi 1.3.1</div>
    </div>

    <!-- SCRIPT -->
    <script src="brainn.js"></script>

    <!-- UX -->
    <script>
      document.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          const loginBox = document.getElementById("login-screen");
          if (!loginBox.classList.contains("hidden")) {
            login();
          }
        }
      });
    </script>
  </body>
</html>
